#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "myhub"
name = "MyHub"
description.en = "Personal daily dashboard with weather and sports"
description.fr = "Tableau de bord personnel quotidien avec meteo et sport"

version = "1.0~ynh1"

maintainers = ["dfavato"]

[upstream]
license = "free"
website = ""
admindoc = ""
userdoc = ""

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = false
ldap = "not_relevant"
sso = "not_relevant"
disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/myhub"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.city_name]
    ask.en = "City name for weather (e.g. Belo Horizonte, Paris, Tokyo)"
    ask.fr = "Nom de la ville pour la meteo (ex. Belo Horizonte, Paris, Tokyo)"
    type = "string"

    [install.api_football_key]
    help.en = "API-Football key from api-football.com. Leave empty to hide the sports section entirely."
    help.fr = "Cle API-Football depuis api-football.com. Laisser vide pour masquer la section sport completement."
    type = "password"
    optional = true

[resources]
    [resources.install_dir]
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "curl, jq"
